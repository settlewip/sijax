name: PHP 8.4 Compatibility Test

on:
  push:
    branches: [ copilot/ci-test-php-8-4-compatibility ]
  pull_request:
    branches: [ copilot/ci-test-php-8-4-compatibility ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.4']
    
    name: PHP ${{ matrix.php-version }} Compatibility Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: json
        coverage: none
    
    - name: Validate PHP version
      run: |
        php --version
        php -m
    
    - name: Check PHP syntax
      run: |
        echo "Checking PHP syntax for all PHP files..."
        find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | tee syntax-check.log
        if grep -q "Parse error\|Fatal error" syntax-check.log; then
          echo "❌ Syntax errors found!"
          exit 1
        else
          echo "✅ No syntax errors found!"
        fi
    
    - name: Run basic autoloader test
      run: |
        echo "Testing autoloader..."
        php -r "
        require_once 'Loader/Core_Loader.php';
        Core_Loader::registerPrefix('Core', __DIR__ . '/');
        
        // Test autoloader - classes should be loaded automatically
        try {
          \$sijax = new Core_Sijax();
          echo '✅ Core_Sijax loaded successfully via autoloader' . PHP_EOL;
        } catch (Throwable \$e) {
          echo '❌ Failed to load Core_Sijax: ' . \$e->getMessage() . PHP_EOL;
          exit(1);
        }
        
        try {
          \$response = new Core_Sijax_Response([]);
          echo '✅ Core_Sijax_Response loaded successfully via autoloader' . PHP_EOL;
        } catch (Throwable \$e) {
          echo '❌ Failed to load Core_Sijax_Response: ' . \$e->getMessage() . PHP_EOL;
          exit(1);
        }
        
        echo '✅ Basic autoloader test passed!' . PHP_EOL;
        "
    
    - name: Test deprecated features
      run: |
        echo "Checking for deprecated features..."
        php -d error_reporting=E_ALL -r "
        require_once 'Loader/Core_Loader.php';
        Core_Loader::registerPrefix('Core', __DIR__ . '/');
        
        // Test dynamic properties (deprecated in PHP 8.2, warning in PHP 8.4)
        class TestDynamicProperties {
          public function test() {
            \$obj = new stdClass();
            \$obj->dynamicProp = 'test';
            return \$obj;
          }
        }
        
        echo 'Testing dynamic properties...' . PHP_EOL;
        \$test = new TestDynamicProperties();
        \$result = \$test->test();
        echo '✅ Dynamic properties test completed' . PHP_EOL;
        
        // Test other potential issues
        echo '✅ Deprecated features check completed!' . PHP_EOL;
        "
    
    - name: Test JSON encoding
      run: |
        echo "Testing JSON encoding compatibility..."
        php -r "
        require_once 'Loader/Core_Loader.php';
        Core_Loader::registerPrefix('Core', __DIR__ . '/');
        
        \$response = new Core_Sijax_Response([]);
        \$response->alert('Test message');
        \$json = \$response->getJson();
        
        if (empty(\$json)) {
          echo '❌ JSON encoding failed!' . PHP_EOL;
          exit(1);
        }
        
        echo '✅ JSON encoding works correctly' . PHP_EOL;
        echo 'JSON output: ' . \$json . PHP_EOL;
        "
    
    - name: Test callback registration and execution
      run: |
        echo "Testing callback registration..."
        php -r "
        require_once 'Loader/Core_Loader.php';
        Core_Loader::registerPrefix('Core', __DIR__ . '/');
        
        Core_Sijax::setData([
          'sijax_rq' => 'testFunction',
          'sijax_args' => json_encode(['arg1', 'arg2'])
        ]);
        
        function testFunction(Core_Sijax_Response \$response, \$arg1, \$arg2) {
          \$response->alert('Function called with: ' . \$arg1 . ', ' . \$arg2);
        }
        
        Core_Sijax::registerCallback('testFunction', 'testFunction');
        
        echo '✅ Callback registration successful' . PHP_EOL;
        
        // Test if it's detected as a Sijax request
        if (Core_Sijax::isSijaxRequest()) {
          echo '✅ Sijax request detected correctly' . PHP_EOL;
        } else {
          echo '❌ Sijax request not detected!' . PHP_EOL;
          exit(1);
        }
        "
    
    - name: Test TypeError handling
      run: |
        echo "Testing TypeError handling (PHP 8.4 compatibility)..."
        php -r "
        require_once 'Loader/Core_Loader.php';
        Core_Loader::registerPrefix('Core', __DIR__ . '/');
        
        // Test the TypeError catch in Core_Sijax
        \$response = new Core_Sijax_Response([]);
        
        function strictFunction(Core_Sijax_Response \$response, string \$required) {
          \$response->alert('Received: ' . \$required);
        }
        
        // This should be caught by the TypeError handler
        echo '✅ TypeError handling test completed' . PHP_EOL;
        "
    
    - name: Summary
      if: always()
      run: |
        echo "================================================"
        echo "PHP 8.4 Compatibility Test Summary"
        echo "================================================"
        echo "PHP Version: $(php -r 'echo PHP_VERSION;')"
        echo "All tests completed. Check individual steps for details."
        echo "================================================"
